# Exemplo de deploy no Docker Swarm.
#
#   openssl rand -hex 32 | docker secret create dashboard_encryption_key -
#   printf '%s' 'SUA_ADMIN_KEY' | docker secret create apisix_admin_key -
#   docker secret create dashboard_tls_cert cert.pem
#   docker secret create dashboard_tls_key key.pem
#   printf '%s' 'TOKEN_CLOUDFLARE' | docker secret create cloudflare_dns_token -   # opcional: certificados automáticos
#   docker stack deploy -c deploy/docker-stack.yml apisix-dashboard
#
# Primeiro admin:
#   docker exec -it $(docker ps -qf name=apisix-dashboard_dashboard) /apisix-dashboard user add -u admin -r admin

services:
  dashboard:
    image: registry.interno/apisix-dashboard:0.1.0
    environment:
      DASH_ADMIN_API_URL: http://apisix:9180
      DASH_ADMIN_API_KEY_FILE: /run/secrets/apisix_admin_key
      DASH_ENCRYPTION_KEY_FILE: /run/secrets/dashboard_encryption_key
      DASH_LISTEN_ADDR: ":8443"
      DASH_TLS_CERT_FILE: /run/secrets/dashboard_tls_cert
      DASH_TLS_KEY_FILE: /run/secrets/dashboard_tls_key
      # Certificados automáticos (Let's Encrypt DNS-01 via Cloudflare). Remova
      # estas linhas e o secret abaixo se não for usar.
      DASH_ACME_CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_dns_token
      DASH_ACME_EMAIL: infra@exemplo.com.br
      # Migração do Kong (só leitura na Admin API do Kong). Descomente durante a
      # migração; o secret só é necessário se a Admin API exigir token.
      # DASH_KONG_ADMIN_URL: http://kong-admin:8001
      # DASH_KONG_ADMIN_TOKEN_FILE: /run/secrets/kong_admin_token
    secrets:
      - apisix_admin_key
      - dashboard_encryption_key
      - dashboard_tls_cert
      - dashboard_tls_key
      - cloudflare_dns_token
    volumes:
      - dashboard-data:/data
    networks:
      - apisix-admin
    ports:
      - target: 8443
        published: 8443
        mode: host   # preserva o IP real do cliente na auditoria
    deploy:
      # O estado (usuários, sessões, auditoria) fica em SQLite: uma réplica só,
      # fixada no nó que guarda o volume.
      replicas: 1
      placement:
        constraints:
          - node.labels.apisix-dashboard == true
      resources:
        limits:
          memory: 256M

volumes:
  dashboard-data:

networks:
  # Rede overlay onde a Admin API (porta 9180) do APISIX está acessível.
  apisix-admin:
    external: true

secrets:
  apisix_admin_key:
    external: true
  dashboard_encryption_key:
    external: true
  dashboard_tls_cert:
    external: true
  dashboard_tls_key:
    external: true
  cloudflare_dns_token:
    external: true
