# GoReleaser: release binaries, checksums, SBOMs and the cosign signature.
# Run by .github/workflows/release.yml after release-please creates the tag and
# the GitHub release. Test locally with `make release-snapshot`.
version: 2

project_name: apisix-dashboard

before:
  hooks:
    # The web UI is embedded at build time; the workflow (or `make web`) builds it.
    - test -f internal/web/dist/index.html

builds:
  - id: apisix-dashboard
    main: ./cmd/apisix-dashboard
    binary: apisix-dashboard
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: file times come from the commit, not the build clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - .env.example
      - deploy/docker-stack.yml

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive (requires syft on PATH).
sboms:
  - artifacts: archive

# Keyless signature of checksums.txt (covers every archive and SBOM listed in
# it). Requires cosign on PATH and an OIDC token (id-token: write).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# release-please writes CHANGELOG.md and the release notes.
changelog:
  disable: true

release:
  # Upload assets to the release created by release-please; keep its notes.
  mode: keep-existing
